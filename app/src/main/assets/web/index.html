<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBox Pro - File Share</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 24px;
        }
        .file-list { list-style: none; }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        .file-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        .file-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .file-size { color: #888; font-size: 0.85em; }
        .download-btn {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
        .empty {
            text-align: center;
            color: #888;
            padding: 40px 0;
        }
        .info {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.85em;
        }
        .logo {
            text-align: center;
            margin-bottom: 16px;
        }
        .logo svg {
            width: 48px;
            height: 48px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="18" height="18" rx="2" stroke="#e94560" stroke-width="2"/>
                <rect x="7" y="12" width="2" height="5" fill="#e94560"/>
                <rect x="11" y="7" width="2" height="10" fill="#e94560"/>
                <rect x="15" y="10" width="2" height="7" fill="#e94560"/>
            </svg>
        </div>
        <h1>ToolBox Pro</h1>
        <p class="subtitle">Local File Sharing</p>
        <ul class="file-list" id="fileList"></ul>
        <p class="info" id="info">Connecting...</p>
    </div>
    <script>
        async function loadFiles() {
            try {
                const res = await fetch('/api/files');
                const files = await res.json();
                const list = document.getElementById('fileList');
                const info = document.getElementById('info');
                if (files.length === 0) {
                    list.innerHTML = '<li class="empty">No files shared yet</li>';
                    info.textContent = 'Waiting for files...';
                    return;
                }
                list.innerHTML = files.map(f => `
                    <li class="file-item">
                        <div>
                            <div class="file-name">${f.name}</div>
                            <div class="file-size">${formatSize(f.size)}</div>
                        </div>
                        <a class="download-btn" href="/download/${f.id}">Download</a>
                    </li>
                `).join('');
                info.textContent = files.length + ' file(s) available';
            } catch (e) {
                document.getElementById('info').textContent = 'Connection error. Please try again.';
            }
        }
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(2) + ' GB';
        }
        loadFiles();
        setInterval(loadFiles, 3000);
    </script>
</body>
</html>
